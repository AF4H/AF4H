name: Deploy af4h.net
on:
  push:
    branches: [main]
    paths:
      - 'af4h.net/**'
      - '.github/workflows/deploy-af4h.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: af4h-net-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to af4h.net and deploy this commit
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faf4h.net%2Fdeploy.php" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error --max-time 110 \
            -X POST -H "Authorization: Bearer ${token}" \
            https://af4h.net/deploy.php
