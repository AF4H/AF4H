version: 1

defaults:
  install_root: /opt/network-radio-server
  ser2net_conf: /etc/ser2net.conf
  usbip_conf: /etc/usbip/devices.conf
  systemd_dir: /etc/systemd/system
  udev_rules_dir: /etc/udev/rules.d
  avahi_services_dir: /etc/avahi/services

ser2net:
  - port: 7301
    device: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baud: 115200
    format: 8N1
    flow: "-"
    notes: local console or radio serial
  - port: 7302
    device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AR0KHLQA-if00-port0
    baud: 115200
    format: 8N1
    flow: "-"
    notes: local console or radio serial
  - port: 7303
    device: /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
    baud: 115200
    format: 8N1
    flow: "-"
    notes: local console or radio serial
  - port: 7304
    device: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_IC-7100_02015445_A-if00-port0
    baud: 19200
    format: 8N1
    flow: "-"
    notes: IC-7100 CAT
  - port: 7305
    device: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_IC-7100_02015445_B-if00-port0
    baud: 19200
    format: 8N1
    flow: "-"
    notes: IC-7100 CAT
  - port: 7310
    device: /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller_D-if00-port0
    baud: 115200
    format: 8N1
    flow: "-"
    notes: router or infrastructure console

usbip:
  server: 172.31.50.219
  devices:
    - busid: 1-1.2.4.1
      name: USB Sound Adapter
      enabled: true

audio:
  bridge:
    enabled: true
    mode: placeholder
    logger_tag: radio-audio
    exec_start: /opt/network-radio-server/audio/radio-audio-bridge.sh
  adapters: []
  streamers:
    - name: wwh23_feed
      enabled: true
      mode: weather
      source: audio-adapter:usb-sound-adapter
      target: icecast
      logger_tag: WWH23-feed
      exec_start: /opt/network-radio-server/audio/streamer/WWH23-feed.sh
    - name: same_watch
      enabled: true
      mode: same-watch
      source: audio-adapter:usb-sound-adapter
      target: same-decoder
      logger_tag: same-watch
      exec_start: /opt/network-radio-server/audio/streamer/same-watch.sh
    - name: same_act
      enabled: true
      mode: same-action
      source: audio-adapter:usb-sound-adapter
      target: same-action
      logger_tag: same-act
      exec_start: /opt/network-radio-server/audio/streamer/same-act.sh
  transports:
    - name: wsjtx_main
      enabled: true
      type: alsa
      source: audio-adapter:usb-sound-adapter
      target: wsjtx
      logger_tag: radio-audio
      exec_start: /opt/network-radio-server/audio/radio-audio-bridge.sh
    - name: icecast_weather
      enabled: true
      type: icecast
      source: rtl-sdr:weather-radio
      target: icecast
      logger_tag: WWH23-feed
      exec_start: /opt/network-radio-server/audio/streamer/WWH23-feed.sh

systemd:
  ser2net:
    description: Serial to Network Proxy
    after:
      - network.target
    exec_start: /usr/sbin/ser2net -n -c /etc/ser2net.conf
    restart: on-failure
  network_radio_dashboard:
    description: Network Radio Dashboard
    after:
      - network.target
    working_directory: /opt/network-radio-server/dashboard
    exec_start: /usr/bin/python3 /opt/network-radio-server/dashboard/server.py
    restart: on-failure
  radio_audio:
    description: Radio Audio Bridge
    after:
      - sound.target
      - network.target
    exec_start: /opt/network-radio-server/audio/radio-audio-bridge.sh
    restart: on-failure
  radio_audio_streamer:
    description: Weather Radio and Audio Streamer
    after:
      - network.target
      - sound.target
    exec_start: /opt/network-radio-server/audio/streamer/WWH23-feed.sh
    restart: always
    restart_sec: 5
  usbipd:
    description: USB/IP Daemon
    after:
      - network.target
    exec_start: /usr/sbin/usbipd -D
    type: forking
    pid_file: /run/usbipd.pid
    restart: on-failure
  usbip_bind:
    description: Bind USB/IP Devices
    after:
      - usbipd.service
    exec_start: /usr/local/bin/usbip-bind.sh
    type: oneshot
    remain_after_exit: true
  usbip_attach:
    description: Attach USB/IP Devices
    after:
      - network-online.target
    wants:
      - network-online.target
    exec_start: /usr/local/bin/usbip-attach.sh
    type: oneshot
    remain_after_exit: true
  usbip_watchdog:
    description: USB/IP Watchdog
    after:
      - network-online.target
    wants:
      - network-online.target
    exec_start: /usr/local/bin/usbip-watchdog.sh
    restart: always
    restart_sec: 5

avahi:
  enabled: true
  service_name: radio-server
  display_name: AF4H Network Radio Server
  description: Network radio server and audio router
  port: 0

services:
  ser2net: true
  radio_audio: true
  radio_audio_streamer: true
  network_radio_dashboard: true
  network_radio_server_target: true
  usbipd: true
  usbip_bind: true
  usbip_attach: true
  usbip_watchdog: true

dropins:
  usbip_bind_override:
    path: systemd/usbip-bind.service.d/override.conf
    content: |
      [Unit]
      After=usbipd.service network-online.target
      Wants=network-online.target

      [Service]
      Environment=USBIP_CONFIG=/etc/usbip/devices.conf
      ExecStart=
      ExecStart=/usr/local/bin/usbip-bind.sh
  avahi_daemon_override:
    path: systemd/avahi-daemon.service.d/override.conf
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

rules:
  usbip_bind:
    path: udev/usbip-bind.rules
    content: ACTION=="add", SUBSYSTEM=="usb", TAG+="systemd", ENV{SYSTEMD_WANTS}+="usbip-bind.service"
  usbip_autobind:
    path: usbip/server/99-usbip-autobind.rules
    content: ACTION=="add", SUBSYSTEM=="usb", RUN+="/usr/local/bin/usbip-autobind.sh"
